name: 功能建议
description: 描述一个会话整理需求或现有流程的改进建议
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你想解决什么问题？当前流程有什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的改进
      description: 请描述希望看到的行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 可选，也可以补充相关界面或操作示例。
